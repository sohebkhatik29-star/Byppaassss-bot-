version: '3.8'

services:
  telegram-bypass-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-bypass-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN:-YOUR_TELEGRAM_BOT_TOKEN_HERE}
      - REQUEST_TIMEOUT=12
      - MAX_REDIRECT_DEPTH=6
    command: python bot.py

  bypass-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-bypass-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: python api.py
